name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: 构建校验（Web 版）
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: Python 语法校验（桌面版）
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          python - <<'PY'
          import ast, pathlib, sys
          p = pathlib.Path('desktop/求职者信息录入.py')
          src = p.read_text(encoding='utf-8-sig')
          ast.parse(src)
          print(f'✅ {p} 语法校验通过（{len(src.splitlines())} 行）')
          PY

  secret-scan:
    name: 密钥泄漏扫描
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 扫描硬编码凭证
        run: |
          echo "检查是否混入真实飞书 / Supabase service_role 凭证..."
          # src/lib/supabase.js 中的 anon key 是前端公开密钥（受 RLS 保护），
          # 按 Supabase 官方设计本就允许公开，故排除该文件。
          PATTERN='(cli_a[0-9a-z]{16,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|"app_secret"[[:space:]]*:[[:space:]]*"[^"]{8,}")'
          if grep -rEn "$PATTERN" --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
             --exclude="src/lib/supabase.js" .; then
            echo "❌ 检测到疑似硬编码凭证，请改用环境变量或配置文件注入"
            exit 1
          fi
          echo "✅ 未发现硬编码凭证"
