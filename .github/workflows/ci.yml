name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: 构建校验（Web 版）
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: Python 语法校验（桌面版）
        run: |
          python - <<'PY'
          import ast, pathlib
          p = pathlib.Path('desktop/求职者信息录入.py')
          src = p.read_text(encoding='utf-8-sig')
          ast.parse(src)
          print(f'✅ {p} 语法校验通过（{len(src.splitlines())} 行）')
          PY

  secret-scan:
    name: 密钥泄漏扫描
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 扫描硬编码凭证
        run: python scripts/secret_scan.py
